name: Build and Publish Artifacts

permissions:
  contents: read
  checks: write
  packages: write
  id-token: write
  attestations: write
 
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
            
    steps:
      # Build
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up JDK 26
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '26'
          distribution: 'corretto'
          cache: maven
          architecture: x64
      - name: Build with Maven
        run: mvn -B verify
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6.4.2
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: '**/target/{surefire,failsafe}-reports/TEST-*.xml'

      # Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: maven-artifacts
          path: |
            **/target/*.jar
            **/target/*.war
          if-no-files-found: error
          
      # Publish to GitHub Packages
      - name: Publish to GitHub Packages
        run: mvn deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    needs: build
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service:
          - name: spring-jpa
            image: robertp22/spring-jpa
            
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Download Maven artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: maven-artifacts
          path: .
          
      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0        
      - name: Extract metadata (tags, labels) for Docker [${{ matrix.service.image }}]
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ matrix.service.image }}
          tags: |
            type=raw,value=latest
      - name: Build and push Docker image  [${{ matrix.service.image }}]
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./${{ matrix.service.name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
      - name: Generate artifact attestation  [${{ matrix.service.image }}]
        uses: actions/attest@v4.1.0
        with:
          subject-name: index.docker.io/${{ matrix.service.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

