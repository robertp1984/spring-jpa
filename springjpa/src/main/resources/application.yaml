server:
  port: 8080

spring:
  application:
    name: springjpa

  datasource:
    url: jdbc:h2:mem:mydb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: password
    driverClassName: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  h2:
    console:
      enabled: true

  jmx:
    enabled: true

  kafka:
    bootstrap-servers: localhost:29092, localhost:29192, localhost:29292
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        enable.idempotence: true
        compression.type: "snappy"
        linger.ms: 500
        acks: "all"
        batch.size: 8192
        schema.registry.url: http://localhost:8081
      transaction-id-prefix: ${spring.application.name}-
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      group-id: springjpa
      properties:
        schema.registry.url: http://localhost:8081
        specific.avro.reader: true
        isolation.level: read_committed

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://authserver:9000

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,loggers"
    jmx:
      exposure:
        include: "health,info,metrics,prometheus,loggers"
    health:
      show-details: when-authorized
      show-components: when-authorized


app:
  asset:
    kafka-publisher:
      topic-name: asset.avro
    incoming:
      topic-name: incoming.asset.avro
      name-format: "Incoming #%d"
      description-format: "Incoming asset with random number #%d"

  kafka:
    retry:
      delay-ms: 1000
      max-attempts: 3

  outbox:
    sender:
      delay: 1000


logging:
  level:
    org:
      softwarecave: trace
      springframework:
        kafka:
          transaction: debug
        transaction: debug
        orm:
          jpa:
            JpaTransactionManager: debug
        security: trace
      apache:
        kafka:
          clients:
            producer:
              internals:
                TransactionManager: debug
